# docker-compose.yml

services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: medsc_mysql_db
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - medsc-network

  # Backend Flask
  backend:
    build: 
      context: ./Backend/app
      dockerfile: Dockerfile
    container_name: medsc_backend
    restart: always
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - medsc-network
    volumes:
      - ./Backend/app:/app
    command: python index.py

  # Frontend Next.js
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: medsc_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - medsc-network

  # ICD-11 API (CIE-11) para diagnósticos y autocompletado
  icd11-api:
    image: whoicd/icd-api
    container_name: medsc_icd11_api
    restart: always
    environment:
      - acceptLicense=true
      - saveAnalytics=false
      - include=2025-01_es
    ports:
      - "8888:80"
    networks:
      - medsc-network

volumes:
  mysql_data:

networks:
  medsc-network:
    driver: bridge
